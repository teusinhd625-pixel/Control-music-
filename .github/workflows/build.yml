name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Garantir pasta control-music
        run: |
          if [ ! -f control-music/index.html ]; then
            mkdir -p /tmp/cm
            find . -maxdepth 1 -mindepth 1 ! -name .git ! -name .github -exec cp -r {} /tmp/cm/ \;
            rm -rf control-music
            mv /tmp/cm control-music
          fi
          ls control-music

      - name: Montar projeto Android
        run: bash control-music/build.sh

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: control-music-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
